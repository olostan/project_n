[project]
name = "project-n"
version = "0.1.0"
description = "Multimodal Communication Support & Behavioral Insight Pipeline for Completely Non-Verbal Autism"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Valentyn Shybanov", email = "olostan@gmail.com" }
]
dependencies = [
    "mlx>=0.22.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "chromadb>=0.4.24",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "certifi>=2024.2.2",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.7.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "mdformat>=0.7.17",
    "mdformat-gfm>=0.3.6",
    "mdformat-mkdocs>=1.0.0",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.20",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "ARG",  # flake8-unused-arguments
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
