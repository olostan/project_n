name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Code Quality & Hermetic Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          version: "latest"

      - name: Install Dependencies
        run: |
          uv sync --extra dev

      - name: "Invariant 10: Forbidden Cloud & PyTorch Imports Scan"
        run: |
          ! grep -rnE '(openai|anthropic|vertexai|google\.generativeai|import torch)' extraction/ models/ rag/ server/ training/

      - name: "Code Quality: Ruff Lint Check"
        run: |
          uv run ruff check .

      - name: "Code Quality: Ruff Format Check"
        run: |
          uv run ruff format --check .

      - name: "Code Quality: 400-Line Hard Ceiling Gate"
        run: |
          uv run python tests/check_file_sizes.py

      - name: "Static Typing: Mypy Strict Mode"
        run: |
          uv run mypy models tests

      - name: "Architecture: Tensor Shape & Dimension Contracts"
        run: |
          uv run python tests/test_shapes.py

      - name: "Documentation: Verify Markdown Relative Links"
        run: |
          uv run python tests/check_markdown_links.py

      - name: "Documentation: MkDocs Strict Build Verification"
        run: |
          uv run mkdocs build --strict

      - name: "Testing: Hermetic Pytest Suite"
        run: |
          uv run pytest -v
